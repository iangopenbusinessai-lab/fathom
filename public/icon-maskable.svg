<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Fathom</title>
  <!-- Maskable variant of the lead-line mark: full-bleed background, artwork
       scaled to 0.7 and centred so it stays inside the 80% safe zone whatever
       shape the launcher masks it to (circle, squircle, rounded square). -->
  <rect width="64" height="64" fill="#0f172a" />
  <g transform="translate(9.6 9.6) scale(0.7)">
    <g fill="none" stroke="#22d3ee" stroke-linecap="round" stroke-width="5">
      <path d="M7 14 q6.25 -6 12.5 0 t12.5 0 t12.5 0 t12.5 0" />
      <path d="M32 14 V41" />
      <path d="M26 24 H38" stroke-width="4.3" />
      <path d="M26 32 H38" stroke-width="4.3" />
    </g>
    <path d="M27.6 41 h8.8 l-1.6 12.5 a2.8 2.8 0 0 1 -5.6 0 z"
          fill="#818cf8" stroke="#818cf8" stroke-width="2.8" stroke-linejoin="round" />
  </g>
</svg>
