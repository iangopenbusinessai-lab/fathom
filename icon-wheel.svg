<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Fathom</title>
  <!-- App icon: the Fathom mark in brass on a navy plate, 11% padding.
       From the "Stencil-cut F" handoff in the Fathom logo exploration.

       This is the source for icon-192.png and icon-512.png - see
       scripts/generate-icons.mjs. The mark keeps its stencil bridges here
       because it is never drawn small enough for them to fill in; the tab
       favicon uses the bridge-less variant instead. -->
  <rect width="512" height="512" fill="#0a1929" />
  <g transform="translate(56 56) scale(4)">
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff" />
      <g fill="#000">
        <rect x="36" y="43" width="14" height="3.2" />
        <rect x="51" y="28" width="3.2" height="30" />
      </g>
    </mask>
    <g stroke="#d4a94a" stroke-width="7.5" stroke-linecap="round">
      <line x1="81.2" y1="68" x2="85.9" y2="70.75" />
      <line x1="50" y1="86" x2="50" y2="91.5" />
      <line x1="18.8" y1="68" x2="14.1" y2="70.75" />
      <line x1="18.8" y1="32" x2="14.1" y2="29.25" />
      <line x1="50" y1="14" x2="50" y2="8.5" />
      <line x1="81.2" y1="32" x2="85.9" y2="29.25" />
    </g>
    <g fill="#d4a94a">
      <circle cx="87.7" cy="71.75" r="4.6" />
      <circle cx="50" cy="93.5" r="4.6" />
      <circle cx="12.3" cy="71.75" r="4.6" />
      <circle cx="12.3" cy="28.25" r="4.6" />
      <circle cx="50" cy="6.5" r="4.6" />
      <circle cx="87.7" cy="28.25" r="4.6" />
    </g>
    <circle cx="50" cy="50" r="32" fill="none" stroke="#d4a94a" stroke-width="8" />
    <g fill="#d4a94a" mask="url(#cut)">
      <rect x="38.5" y="31" width="9" height="40" rx="1.5" />
      <rect x="38.5" y="31" width="25" height="9" rx="1.5" />
      <rect x="38.5" y="47" width="19" height="9" rx="1.5" />
    </g>
  </g>
</svg>
