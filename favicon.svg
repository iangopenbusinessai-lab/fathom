<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Fathom</title>
  <!-- The lead line: the sounding line and lead weight a fathom is measured
       with. Same mark as the app icon in icon-sounding-line.svg - the tab and
       the installed app must not read as two different products. Strokes are a
       shade heavier here because this is drawn at 16-32px in a tab. -->
  <g fill="none" stroke="#22d3ee" stroke-linecap="round" stroke-width="4">
    <!-- surface swell -->
    <path d="M7 14 q6.25 -6 12.5 0 t12.5 0 t12.5 0 t12.5 0" />
    <!-- the line paying out -->
    <path d="M32 14 V41" />
    <!-- depth marks knotted into the line -->
    <path d="M26 24 H38" stroke-width="3.4" />
    <path d="M26 32 H38" stroke-width="3.4" />
  </g>
  <!-- the lead itself -->
  <path d="M27.6 41 h8.8 l-1.6 12.5 a2.8 2.8 0 0 1 -5.6 0 z"
        fill="#818cf8" stroke="#818cf8" stroke-width="2" stroke-linejoin="round" />
</svg>
